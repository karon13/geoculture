<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoCulture - a daily culture geoguesser</title>
    <meta name="description" content="Guess where famous art, music, books and movies come from. Five rounds a day." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="globe"></div>

    <header class="topbar">
      <div class="brand">GeoCulture</div>
      <div class="status">
        <span id="round-label"></span>
        <span class="dot">·</span>
        <span id="score-label"></span>
        <span class="dot">·</span>
        <span id="streak-label" title="Daily streak"></span>
      </div>
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div id="menu" class="menu" role="menu" hidden>
        <button type="button" role="menuitem" id="menu-history">📅 Previous results</button>
        <button type="button" role="menuitem" id="menu-unit">📏 Distances</button>
        <button type="button" role="menuitem" id="menu-map">🗺 Switch map (testing)</button>
        <button type="button" role="menuitem" id="reset" title="Testing: wipes all saved results and the streak, as if this were your first visit">↻ Reset everything (testing)</button>
      </div>
    </header>

    <div id="history" class="sheet" role="dialog" aria-modal="true" aria-labelledby="history-title" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2 id="history-title">Previous results</h2>
          <button type="button" id="history-close" class="sheet-close" aria-label="Close">✕</button>
        </div>
        <p class="sheet-note">Catch up on the last 28 days. Only today counts toward your streak.</p>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>

    <section id="panel" class="panel" aria-live="polite"></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
