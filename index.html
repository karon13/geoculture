<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoCulture - a daily culture geoguesser</title>
    <meta name="description" content="Guess where famous art, music, books and movies come from. A free daily geoguessing game: five rounds a day, pin each one on the globe." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoCulture" />
    <meta property="og:title" content="GeoCulture - a daily culture geoguesser" />
    <meta property="og:description" content="Five clues from art, music, books and movies. Pin where each one comes from. A new set every day." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GeoCulture",
        "url": "%SITE_URL%/",
        "description": "A free daily geoguessing game based on art, music, books and movies.",
        "applicationCategory": "GameApplication",
        "genre": "Quiz",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="globe"></div>
    <noscript>
      <p style="position:relative;z-index:10;max-width:560px;margin:80px auto;padding:0 20px;line-height:1.6">
        GeoCulture is a free daily game: five clues from art, music, books and movies, and you pin where each one
        comes from on a globe. It needs JavaScript to run. <a href="./about/" style="color:#ffb454">Read how to play</a>.
      </p>
    </noscript>

    <header class="topbar">
      <div class="brand">GeoCulture</div>
      <div class="status">
        <span id="round-label"></span>
        <span class="dot">·</span>
        <span id="score-label"></span>
        <span class="dot">·</span>
        <span id="streak-label" title="Daily streak"></span>
      </div>
      <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div id="menu" class="menu" role="menu" hidden>
        <button type="button" role="menuitem" id="menu-history">📅 Previous results</button>
        <a role="menuitem" href="./about/">❓ How to play &amp; about</a>
        <a role="menuitem" href="./privacy/">🔒 Privacy</a>
        <div class="menu-row" role="group" aria-labelledby="unit-label">
          <span id="unit-label">📏 Distances</span>
          <span class="seg" id="menu-unit">
            <button type="button" data-unit="km" aria-pressed="false">km</button>
            <button type="button" data-unit="mi" aria-pressed="false">mi</button>
          </span>
        </div>
        <button type="button" role="menuitem" id="reset" title="Testing: wipes all saved results and the streak, as if this were your first visit">↻ Reset everything (testing)</button>
      </div>
    </header>

    <div id="history" class="sheet" role="dialog" aria-modal="true" aria-labelledby="history-title" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2 id="history-title">Previous results</h2>
          <button type="button" id="history-close" class="sheet-close" aria-label="Close">✕</button>
        </div>
        <p class="sheet-note">Catch up on the last 28 days. Only today counts toward your streak.</p>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>

    <div id="map-error" class="map-error" role="alert" hidden>The map could not be loaded. Check your connection and reload the page.</div>

    <section id="panel" class="panel" aria-live="polite"></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
